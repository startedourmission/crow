name: Crow
options:
  bundleIdPrefix: dev.chajinwoo
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: 1
    SWIFT_STRICT_CONCURRENCY: complete

packages:
  CrowCore:
    path: Packages/CrowCore
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.20.0
  Citadel:
    url: https://github.com/orlandos-nl/Citadel
    exactVersion: 0.12.1

targetTemplates:
  CrowApp:
    type: application
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.chajinwoo.crow
        PRODUCT_NAME: Crow
        PRODUCT_MODULE_NAME: Crow
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Crow
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: CrowCore
        product: CrowCore
      - package: SwiftTerm
        product: SwiftTerm
      - package: Citadel
        product: Citadel

targets:
  Crow-iOS:
    templates:
      - CrowApp
    platform: iOS
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDarkContent
        CODE_SIGN_ENTITLEMENTS: App/Crow-iOS.entitlements
    scheme:
      testTargets:
        - CrowTests
  Crow-macOS:
    templates:
      - CrowApp
    platform: macOS
    scheme:
      testTargets:
        - CrowMacTests
    settings:
      base:
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_HARDENED_RUNTIME: YES
        INFOPLIST_KEY_NSHighResolutionCapable: YES
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        CODE_SIGN_ENTITLEMENTS: App/Crow-macOS.entitlements
  CrowTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          - macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.chajinwoo.crow.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Crow.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Crow"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: Crow-iOS
  CrowMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
        excludes:
          - macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.chajinwoo.crow.mac-tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Crow.app/Contents/MacOS/Crow"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: Crow-macOS
