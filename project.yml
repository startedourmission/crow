name: Crow
options:
  bundleIdPrefix: dev.chajinwoo
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.4"
    CURRENT_PROJECT_VERSION: 5
    SWIFT_STRICT_CONCURRENCY: complete

packages:
  CrowCore:
    path: Packages/CrowCore
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.20.0
  Citadel:
    url: https://github.com/orlandos-nl/Citadel
    exactVersion: 0.12.1
  NIOSSH:
    url: https://github.com/Wellz26/swift-nio-ssh.git
    exactVersion: 0.3.7
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.6

targetTemplates:
  CrowApp:
    type: application
    productName: Crow
    sources:
      - path: App
        excludes:
          - Agents/agent-history.py
          - Editor/markdown-editor.js
          - Editor/obsidian-preview.js
          - Editor/obsidian-preview.css
          - Editor/crowmap.js
          - Editor/crowmap.css
          - Editor/MarkdownEditor-LICENSES.txt
          - Screen/screen.html
          - Screen/screen-client.js
          - Screen/noVNC-LICENSE.txt
          - Screen/noVNC-MPL-2.0.txt
          - Screen/noVNC-BSD-3-Clause.txt
          - Screen/noVNC-BSD-2-Clause.txt
          - Screen/noVNC-pako-LICENSE.txt
          - Screen/noVNC-AUTHORS.txt
      - path: App/Agents/agent-history.py
        buildPhase: resources
      - path: App/Screen/screen.html
        buildPhase: resources
      - path: App/Screen/screen-client.js
        buildPhase: resources
      - path: App/Screen/noVNC-LICENSE.txt
        buildPhase: resources
      - path: App/Screen/noVNC-MPL-2.0.txt
        buildPhase: resources
      - path: App/Screen/noVNC-BSD-3-Clause.txt
        buildPhase: resources
      - path: App/Screen/noVNC-BSD-2-Clause.txt
        buildPhase: resources
      - path: App/Screen/noVNC-pako-LICENSE.txt
        buildPhase: resources
      - path: App/Screen/noVNC-AUTHORS.txt
        buildPhase: resources
      - path: App/Editor/obsidian-preview.js
        buildPhase: resources
      - path: App/Editor/crowmap.js
        buildPhase: resources
      - path: App/Editor/crowmap.css
        buildPhase: resources
      - path: App/Editor/obsidian-preview.css
        buildPhase: resources
      - path: App/Editor/markdown-editor.js
        buildPhase: resources
      - path: App/Editor/MarkdownEditor-LICENSES.txt
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.chajinwoo.crow
        PRODUCT_NAME: Crow
        PRODUCT_MODULE_NAME: Crow
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Crow
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: CrowCore
        product: CrowCore
      - package: SwiftTerm
        product: SwiftTerm
      - package: Citadel
        product: Citadel
      - package: NIOSSH
        product: NIOSSH

targets:
  Crow-iOS:
    templates:
      - CrowApp
    platform: iOS
    settings:
      base:
        INFOPLIST_FILE: Config/Crow-iOS-Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDarkContent
        CODE_SIGN_ENTITLEMENTS: App/Crow-iOS.entitlements
    scheme:
      testTargets:
        - CrowTests
  Crow-macOS:
    templates:
      - CrowApp
    platform: macOS
    scheme:
      testTargets:
        - CrowMacTests
    settings:
      base:
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/Crow-macOS-Info.plist
        SPARKLE_PUBLIC_ED_KEY: ""
        CODE_SIGN_ENTITLEMENTS: App/Crow-macOS.entitlements
    dependencies:
      - package: Sparkle
  CrowTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          - macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.chajinwoo.crow.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Crow.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Crow"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: Crow-iOS
  CrowMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
        excludes:
          - macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.chajinwoo.crow.mac-tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Crow.app/Contents/MacOS/Crow"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: Crow-macOS
