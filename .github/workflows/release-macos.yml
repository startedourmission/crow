name: Release notarized macOS app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-macos
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
      SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
      BUILD_NUMBER: ${{ github.run_number }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out Crow
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check release configuration
        env:
          DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_KEY_BASE64 }}
          SPARKLE_PRIVATE_KEY_BASE64: ${{ secrets.SPARKLE_PRIVATE_KEY_BASE64 }}
        run: |
          missing=()
          for name in \
            APPLE_TEAM_ID \
            DEVELOPER_ID_CERTIFICATE_BASE64 \
            DEVELOPER_ID_CERTIFICATE_PASSWORD \
            KEYCHAIN_PASSWORD \
            NOTARY_KEY_BASE64 \
            NOTARY_KEY_ID \
            NOTARY_ISSUER_ID \
            SPARKLE_PUBLIC_ED_KEY \
            SPARKLE_PRIVATE_KEY_BASE64; do
            if [[ -z "${!name:-}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required GitHub Actions secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must look like v0.1.0; got $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Install Developer ID certificate
        env:
          DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_KEY_BASE64 }}
          SPARKLE_PRIVATE_KEY_BASE64: ${{ secrets.SPARKLE_PRIVATE_KEY_BASE64 }}
        run: |
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/crow-signing.keychain-db"
          notary_key_path="$RUNNER_TEMP/AuthKey_${NOTARY_KEY_ID}.p8"
          sparkle_private_key_path="$RUNNER_TEMP/sparkle-private-key"

          echo -n "$DEVELOPER_ID_CERTIFICATE_BASE64" | base64 --decode -o "$certificate_path"
          echo -n "$NOTARY_KEY_BASE64" | base64 --decode -o "$notary_key_path"
          echo -n "$SPARKLE_PRIVATE_KEY_BASE64" | base64 --decode -o "$sparkle_private_key_path"
          chmod 600 "$notary_key_path" "$sparkle_private_key_path"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" \
            -P "$DEVELOPER_ID_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" \
            "$keychain_path"
          security list-keychain -d user -s "$keychain_path"

          echo "KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"
          echo "NOTARY_KEY_PATH=$notary_key_path" >> "$GITHUB_ENV"
          echo "SPARKLE_PRIVATE_KEY_PATH=$sparkle_private_key_path" >> "$GITHUB_ENV"

      - name: Build, sign, and notarize
        run: scripts/release-macos.sh "${GITHUB_REF_NAME#v}" dist

      - name: Create GitHub release
        run: |
          version="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "dist/Crow-${version}-macOS.zip" \
              "dist/Crow-${version}-macOS.zip.sha256" \
              "dist/Crow-macOS.dmg" \
              "dist/Crow-macOS.dmg.sha256" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "dist/Crow-${version}-macOS.zip" \
              "dist/Crow-${version}-macOS.zip.sha256" \
              "dist/Crow-macOS.dmg" \
              "dist/Crow-macOS.dmg.sha256" \
              --verify-tag \
              --generate-notes \
              --title "Crow $version"
          fi

      - name: Update Homebrew cask
        run: |
          version="${GITHUB_REF_NAME#v}"
          sha256="$(awk '{print $1}' dist/Crow-macOS.dmg.sha256)"
          git fetch origin main
          publish_directory="$RUNNER_TEMP/crow-publish"
          git worktree add "$publish_directory" origin/main
          scripts/render-homebrew-cask.sh "$version" "$sha256" "$publish_directory/Casks/crow.rb"

          appcast_directory="$RUNNER_TEMP/crow-appcast"
          mkdir -p "$appcast_directory"
          cp dist/Crow-macOS.dmg "$appcast_directory/"
          if [[ -f "$publish_directory/appcast.xml" ]]; then
            cp "$publish_directory/appcast.xml" "$appcast_directory/appcast.xml"
          fi
          gh release view "$GITHUB_REF_NAME" --json body --jq .body \
            > "$appcast_directory/Crow-macOS.md"

          generate_appcast="$(find build/SourcePackages -type f -path '*/Sparkle/bin/generate_appcast' -print -quit)"
          if [[ -z "$generate_appcast" ]]; then
            echo "Sparkle generate_appcast was not found in SwiftPM artifacts." >&2
            exit 1
          fi
          "$generate_appcast" \
            --ed-key-file "$SPARKLE_PRIVATE_KEY_PATH" \
            --download-url-prefix "https://github.com/startedourmission/crow/releases/download/${GITHUB_REF_NAME}/" \
            --embed-release-notes \
            --maximum-deltas 0 \
            --maximum-versions 10 \
            "$appcast_directory"
          cp "$appcast_directory/appcast.xml" "$publish_directory/appcast.xml"
          xmllint --noout "$publish_directory/appcast.xml"

          tap_path="$(brew --repository)/Library/Taps/startedourmission/homebrew-crow"
          mkdir -p "$(dirname "$tap_path")"
          ln -s "$publish_directory" "$tap_path"
          brew style --cask startedourmission/crow/crow
          brew audit --cask --strict startedourmission/crow/crow

          cd "$publish_directory"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Casks/crow.rb appcast.xml
          if git diff --cached --quiet; then
            echo "Homebrew cask is already current."
          else
            git commit -m "Update Crow to ${version}"
            git push origin HEAD:main
          fi

      - name: Remove temporary keychain
        if: always()
        run: |
          if [[ -n "${KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          rm -f \
            "$RUNNER_TEMP/developer-id.p12" \
            "$RUNNER_TEMP/AuthKey_${NOTARY_KEY_ID}.p8" \
            "$RUNNER_TEMP/sparkle-private-key"
